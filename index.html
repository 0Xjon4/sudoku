<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku | Cosmic Puzzles</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="difficulty">
    <button class="diff-btn" data-level="easy">Easy</button>
    <button class="diff-btn selected-diff" data-level="medium">Medium</button>
    <button class="diff-btn" data-level="hard">Hard</button>
</div>
    <div class="container" id="start-screen">
        <h1>Sudoku</h1>
        <h2>A little puzzle under the stars ✦</h2>
        <p>Relax your mind and enjoy the stars.</p>
        <button id="play-btn">Play</button>
    </div>

    <div class="container hidden" id="game-screen">
        <h1>Sudoku</h1>
        <p>Mistakes: <span id="mistakes">0</span></p>
        <p>Time: <span id="timer">00:00</span></p>
        <p id="message"></p>
<button id="new-game-btn">New Game</button>
        <div id="board"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
